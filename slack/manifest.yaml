# Slack app manifest for the lab's bot. Create the app at https://api.slack.com/apps -> Create New App ->
# From a manifest, paste this, and change the name if you like (then set SLACK_BOT_NAME in lab.conf to match).
display_information:
  name: lab-bot
  description: A research lab's AI agents. Mention @lab-bot or message it to ask about a connected project.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: lab-bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - users:read
      - files:read
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - member_joined_channel
      # Optional: replies in threads arrive at once instead of through the listener's one-minute poll.
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
