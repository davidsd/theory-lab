# Which model and effort each kind of agent runs. No sudo needed: edit this file,
# commit it, and agents started after that use it. Values are checked, never run as code.
# Efforts: low, medium, high, xhigh, max. A lead can override the effort for one job with
# `lab spawn ... --effort <level>` (e.g. medium for a Codex coding task).
#
# role      codex model   codex effort   claude model      claude effort
lead        gpt-6-astra   high           claude-opus-5-5   high  
director    gpt-6-astra   high           claude-opus-5-5   medium
worker      gpt-6-astra   xhigh          claude-opus-5-5   high
explorer    gpt-6-astra   xhigh          claude-opus-5-5   high
verifier    gpt-6-astra   high           claude-opus-5-5   high
responder   gpt-6-astra   high           claude-opus-5-5   high
